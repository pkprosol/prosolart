title: "About"
intro_heading: "About me:"
intro: |
  <p>Wladyslaw Prosol is a Polish American artist based in New England. He graduated with a Master’s Degree in Architecture and Art from the Cracow University of Technology in Poland. Before coming to the United States he used to sell landscapes and other works by the old city wall in Cracow as well as on the streets of Amsterdam.</p>
  <p>Classically trained, he moved to the United States and shifted toward American Abstract Expressionism. This new direction launched his quest to find his own artistic identity. He works in oil, acrylic and a spectrum of experimental art. Influenced by the flow of virtual images and rapid development of digital and AI art, he explores the role of physical art within this new visual reality.</p>
  <p>In his latest works, he seeks to find a path through a reality where visual stimuli and information flow constantly and chaotically. Imagine coming across someone’s computer screen, covered with open windows, icons, and messages. This dizzying landscape is our new normal, and becomes a challenge for the artist to navigate.</p>
